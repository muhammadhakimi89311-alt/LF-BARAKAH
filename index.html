<script>
// Simple navigation
const pages = ["page1","page2","page3"];
pages.forEach((id, i) => {
  document.querySelector(`[href="#${id}"]`)?.addEventListener('click', (e) => {
    e.preventDefault();
    pages.forEach(p => document.getElementById(p).style.display = 'none');
