<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Day Intern LF BARAKAH</title>
<style>
body { font-family:'Quicksand', sans-serif; text-align:center; background:#fafafa; margin:0; padding:20px;}
section { padding:50px 10px; display:none;}
section.active { display:block;}
.wp img { width:100%; max-width:500px; border-radius:15px;}
.button { display:inline-block; margin:15px; padding:10px 20px; background:#0077cc; color:#fff; text-decoration:none; border-radius:8px;}
.embed-player { margin:20px auto; width:100%; max-width:600px;}
</style>
</head>
<body>

<h2>Dengar Lagu “Merindu Tanpa Kata”</h2>

<div class="embed-player">
  <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"
  src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/junaidi-cmc/kapilla-merindu-tanpa-kata&color=%230077cc&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>
</div>

<!-- Section 1 -->
<section id="page1" class="active">
  <div class="wp">
    <img src="https://i.imgur.com/PLACEHOLDER_BG1.jpg" alt="Office">
  </div>
  <h1>Terima Kasih LF BARAKAH</h1>
  <p>Terima kasih atas peluang & pengalaman intern saya 🌱</p>
  <a href="#page2" class="button">Next ➡</a>
</section>

<!-- Section 2 -->
<section id="page2">
  <div class="wp">
    <img src="https://i.imgur.com/PLACEHOLDER_BG2.jpg" alt="Kenangan">
  </div>
  <h2>Kenangan Terbaik</h2>
  <p>Saya akan bawa setiap ilmu yang saya pelajari dari kalian semua</p>
  <a href="#page3" class="button">Next ➡</a>
  <a href="#page1" class="button">⬅ Back</a>
</section>

<!-- Section 3 -->
<section id="page3">
  <div class="wp">
    <img src="https://i.imgur.com/PLACEHOLDER_BG3.jpg" alt="Akhir">
  </div>
  <h2>Sampai Jumpa Lagi</h2>
  <p>Semoga LF BARAKAH terus berjaya 🌟</p>
  <a href="#page2" class="button">⬅ Back</a>
</section>

<script>
// Simple navigation
const pages = ["page1","page2","page3"];
pages.forEach((id) => {
  document.querySelectorAll(`[href="#${id}"]`).forEach(el => {
    el.addEventListener('click', function(e){
      e.preventDefault();
      pages.forEach(p => document.getElementById(p).classList.remove('active'));
      document.getElementById(id).classList.add('active');
    });
  });
});
</script>

</body>
</html>
